line-length = 125
indent-width = 4
target-version = "py314"

extend-exclude = [
    "ndspy",
    "updater",
]

[lint]
select = ["E4", "E7", "E9", "F"]
ignore = []

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

exclude = [
    "ndspy",
    "updater",
]
